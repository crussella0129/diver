[package]
name = "diver-cli"
version = "0.1.0"
edition = "2024"
description = "Find knowledge, not just papers, on ArXiv"
license = "Apache-2.0"

[[bin]]
name = "diver"
path = "src/main.rs"

[dependencies]
diver-core = { path = "../diver-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
